name: Build app

# Builds EverClip.app on a macOS runner (which has full Xcode, so SwiftUI compiles)
# and uploads it as a downloadable zip artifact.

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    name: Build EverClip.app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build EverClip.app
        run: Scripts/build-app.sh release

      - name: Zip the app bundle
        run: ditto -c -k --keepParent build/EverClip.app build/EverClip.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: EverClip-app
          path: build/EverClip.zip
          if-no-files-found: error

      - name: Publish release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/EverClip.zip
          name: EverClip ${{ github.ref_name }}
          body: |
            EverClip ${{ github.ref_name }} — a local-first clipboard manager for macOS.

            ## Install
            1. Download **EverClip.zip** below and double-click to unzip.
            2. Drag **EverClip.app** into your `Applications` folder.
            3. **First launch** (this build is open-source and ad-hoc signed, so macOS Gatekeeper will warn):
               right-click **EverClip.app → Open → Open**. If it still refuses, run once:
               ```
               xattr -dr com.apple.quarantine /Applications/EverClip.app
               ```
            4. It lives in the menu bar. Press **⌥⌘V** to open it (customizable in Settings).
            5. For paste-back, grant **Accessibility** in System Settings → Privacy & Security → Accessibility.

            Requires macOS 13+ (Apple Silicon).
