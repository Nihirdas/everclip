name: Build app

# Builds EverClip.app on a macOS runner (which has full Xcode, so SwiftUI compiles)
# and uploads it as a downloadable zip artifact.

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

jobs:
  build:
    name: Build EverClip.app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build EverClip.app
        run: Scripts/build-app.sh release

      - name: Zip the app bundle
        run: ditto -c -k --keepParent build/EverClip.app build/EverClip.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: EverClip-app
          path: build/EverClip.zip
          if-no-files-found: error
