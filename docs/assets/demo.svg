<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="EverClip demo: searching the clipboard history and pasting an item back">
  <defs>
    <clipPath id="typeClip"><rect x="64" y="36" width="0" height="22">
      <animate attributeName="width" dur="7s" repeatCount="indefinite"
        keyTimes="0;0.1;0.26;0.84;0.9;1" values="0;0;150;150;0;0"/>
    </rect></clipPath>
  </defs>

  <!-- panel -->
  <rect x="16" y="14" width="688" height="372" rx="16" fill="#141821"/>
  <rect x="16.5" y="14.5" width="687" height="371" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>

  <!-- search field -->
  <rect x="32" y="30" width="656" height="32" rx="9" fill="#0e1017" stroke="#6a78f7" stroke-opacity="0.55"/>
  <g fill="none" stroke="#8b93a5" stroke-width="2" stroke-linecap="round">
    <circle cx="52" cy="46" r="6"/><path d="M57 51l4 4"/>
  </g>
  <text clip-path="url(#typeClip)" x="66" y="51" font-size="14.5" fill="#eef0f6">screenshot</text>
  <text x="60" y="51" font-size="14.5" fill="#5b6474">
    <tspan>Search clipboard…</tspan>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite"
      keyTimes="0;0.09;0.11;0.9;0.95;1" values="1;1;0;0;1;1"/>
  </text>

  <line x1="16" y1="74" x2="704" y2="74" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- tabs -->
  <g transform="translate(32,84)">
    <rect x="0" y="0" width="74" height="24" rx="12" fill="#6a78f7" fill-opacity="0.18"/>
    <text x="14" y="16" font-size="12" font-weight="600" fill="#8f97f7">Recent</text>
    <text x="92" y="16" font-size="12" fill="#8b93a5">Favorites</text>
  </g>
  <line x1="16" y1="118" x2="704" y2="118" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- selection highlight (moves from row 0 to row 1) -->
  <rect x="26" y="124" width="668" height="40" rx="9" fill="#6a78f7">
    <animate attributeName="fill-opacity" dur="7s" repeatCount="indefinite"
      keyTimes="0;0.1;0.26;0.4;0.61;0.7;0.86;1" values="0.16;0.16;0.2;0.24;0.24;0.42;0.28;0.16"/>
    <animateTransform attributeName="transform" type="translate" dur="7s" repeatCount="indefinite"
      keyTimes="0;0.1;0.26;0.4;0.61;0.7;0.86;1" values="0 0;0 0;0 0;0 44;0 44;0 44;0 44;0 0"/>
  </rect>

  <!-- ROW 0 — Link (dims when filtered out) -->
  <g transform="translate(0,126)">
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite"
      keyTimes="0;0.1;0.26;0.4;0.61;0.7;0.86;1" values="1;1;1;0.2;0.2;0.2;0.2;1"/>
    <rect x="34" y="5" width="30" height="30" rx="7" fill="#4aa3e6" fill-opacity="0.16"/>
    <svg x="41" y="12" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4aa3e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
    <text x="80" y="18" font-size="13" fill="#eef0f6">https://stripe.com/docs/api/charges</text>
    <rect x="80" y="24" width="34" height="14" rx="7" fill="#4aa3e6" fill-opacity="0.18"/>
    <text x="87" y="34" font-size="9" font-weight="600" fill="#4aa3e6">Link</text>
    <text x="122" y="34" font-size="10" fill="#6b7280">Safari · now</text>
  </g>

  <!-- ROW 1 — Screenshot (the match; stays lit) -->
  <g transform="translate(0,170)">
    <rect x="34" y="5" width="30" height="30" rx="7" fill="#e6994a" fill-opacity="0.16"/>
    <svg x="41" y="12" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e6994a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    <text x="80" y="18" font-size="13" fill="#eef0f6">Screenshot · 2560×1440</text>
    <rect x="80" y="24" width="66" height="14" rx="7" fill="#e6994a" fill-opacity="0.18"/>
    <text x="87" y="34" font-size="9" font-weight="600" fill="#e6994a">Screenshot</text>
    <text x="154" y="34" font-size="10" fill="#6b7280">2m</text>
  </g>

  <!-- ROW 2 — Text -->
  <g transform="translate(0,214)">
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite"
      keyTimes="0;0.1;0.26;0.4;0.61;0.7;0.86;1" values="1;1;1;0.2;0.2;0.2;0.2;1"/>
    <rect x="34" y="5" width="30" height="30" rx="7" fill="#9aa3b2" fill-opacity="0.16"/>
    <svg x="41" y="12" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b7becb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <text x="80" y="18" font-size="13" fill="#eef0f6">git rebase -i HEAD~3</text>
    <rect x="80" y="24" width="34" height="14" rx="7" fill="#9aa3b2" fill-opacity="0.18"/>
    <text x="88" y="34" font-size="9" font-weight="600" fill="#b7becb">Text</text>
    <text x="122" y="34" font-size="10" fill="#6b7280">Terminal · 6m</text>
  </g>

  <!-- ROW 3 — File -->
  <g transform="translate(0,258)">
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite"
      keyTimes="0;0.1;0.26;0.4;0.61;0.7;0.86;1" values="1;1;1;0.2;0.2;0.2;0.2;1"/>
    <rect x="34" y="5" width="30" height="30" rx="7" fill="#e06b8c" fill-opacity="0.16"/>
    <svg x="41" y="12" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e06b8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
    <text x="80" y="18" font-size="13" fill="#eef0f6">Q3-report-final.pdf</text>
    <rect x="80" y="24" width="32" height="14" rx="7" fill="#e06b8c" fill-opacity="0.18"/>
    <text x="87" y="34" font-size="9" font-weight="600" fill="#e06b8c">File</text>
    <text x="120" y="34" font-size="10" fill="#6b7280">Finder · 14m</text>
  </g>

  <!-- ROW 4 — Image -->
  <g transform="translate(0,302)">
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite"
      keyTimes="0;0.1;0.26;0.4;0.61;0.7;0.86;1" values="1;1;1;0.2;0.2;0.2;0.2;1"/>
    <rect x="34" y="5" width="30" height="30" rx="7" fill="#35c28b" fill-opacity="0.16"/>
    <svg x="41" y="12" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#35c28b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
    <text x="80" y="18" font-size="13" fill="#eef0f6">Mockup · 800×600</text>
    <rect x="80" y="24" width="40" height="14" rx="7" fill="#35c28b" fill-opacity="0.18"/>
    <text x="87" y="34" font-size="9" font-weight="600" fill="#35c28b">Image</text>
    <text x="128" y="34" font-size="10" fill="#6b7280">Figma · 1h</text>
  </g>

  <!-- paste toast -->
  <g opacity="0">
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite"
      keyTimes="0;0.1;0.26;0.4;0.61;0.7;0.86;1" values="0;0;0;0;0;1;1;0"/>
    <rect x="270" y="350" width="180" height="30" rx="15" fill="#0e1017" stroke="#35c28b" stroke-opacity="0.5"/>
    <path d="M289 365l4 4 7-7" fill="none" stroke="#35c28b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="308" y="369" font-size="12.5" fill="#eef0f6">Pasted — ⌥⌘V</text>
  </g>
</svg>
